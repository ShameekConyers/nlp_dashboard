# Real-time-with-pause (RTwP) versus turn-based (TB) combat, phase A (exploratory).
#
# Cohorts: crpg and strategy, each with subgroups rtwp and turn_based. dual_mode
# holds games that ship both modes and is analysed on its own. Every app ID was
# checked with study_cli --lookup and every combat-model classification and
# mode-addition date against a first-party page. The evidence table is in
# docs/rtwp_turn_study_design.md. Tags: dual_mode marks the subslice,
# mode_added a TB mode added after launch (date in [[mode_events]]),
# both_at_launch a game that shipped both modes, swap_in a candidate replaced
# with a better-matched game (see the design doc).
#
# Data stays local: everything under data/rtwp_turn_2026/ is ignored by Git.

[study]
name = "rtwp_turn_2026"
title = "Real-time-with-pause versus turn-based combat"
seed_db = "data/rtwp_turn_2026/rtwp_turn_2026_seed.db"
full_db = "data/rtwp_turn_2026/rtwp_turn_2026_full.db"
raw_dir = "data/rtwp_turn_2026/raw/rtwp_turn_2026"
language_filter = true
aspect_lexicon = "studies/aspects_rtwp_turn_v3.toml"
# Phase A: every outcome statistic uses the development half of the hash split.
stats_split = "dev"
# Statistics run on that half of the full database, copied into
# data/rtwp_turn_2026/rtwp_turn_2026_full_dev.db, not on the seed (Oct 15 2026).
stats_source = "full"

[sampling]
method = "natural"            # census pull, uniform per-game seed sample
filter = "recent"             # creation-date order, newest first
language = "english"
review_type = "all"           # never positive/negative: that would stratify
purchase_type = "all"
filter_offtopic_activity = 1
num_per_page = 100
raw_cap_per_game = 10000      # dual-mode titles override this with raw_cap = 20000
seed_cap_per_game = 500
random_seed = 42

[baseline]                    # population check (num_per_page=0)
language = "all"
purchase_type = "all"

[topics]
umap_preset = "bertopic_default"
min_topic_size = 40

# Which audit's labels govern each aspect's precision (docs/rtwp_turn_protocol.md,
# section 13). The six aspects revised in v3 take the v3 labels. The three that
# passed the v2 audit keep their v2 patterns and their v2 labels. Every
# version named here is also an audit set the phase B frame excludes.
[aspect_labels]
rtwp_turn_v3 = ["mode_turn_based", "pause_micro", "waiting_turns", "combat_pacing", "ui_clarity", "price_dlc"]
rtwp_turn_v2 = ["mode_rtwp", "realtime_chaos", "bugs_performance"]

# Turn-based mode added after launch: first availability on the default Steam
# branch (opt-in beta branches excluded), at the publication time (UTC) of the
# developer post that announced it. Read by src/dual_mode.py.
[[mode_events]]
app_id = 291650
date = 2026-04-06T17:32:35Z
opt_in_beta = 2025-11-07
source = "https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1828894815565733"

[[mode_events]]
app_id = 640820
