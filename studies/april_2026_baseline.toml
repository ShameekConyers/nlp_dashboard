# April 2026 cross-genre baseline. Mirrors src/utils.GAME_CATALOG and the
# original pipeline paths so every default command reproduces the April study.

[study]
name = "april_2026_baseline"
title = "April 2026 cross-genre baseline"
seed_db = "data/seed.db"
full_db = "data/full.db"
raw_dir = "data/raw"
language_filter = false
# Transformer scores live beside the seed so data/seed.db keeps its hash (Decision 12).
scores_db = "data/seed_transformer_scores.db"
# Shipped study: stages refuse to write its files without --unfreeze-i-know.
frozen = true

[sampling]
method = "stratified_legacy"  # 50/50 recommended per game, built by db_setup.build_seed_db
filter = "recent"
language = "english"
review_type = "all"
purchase_type = "all"
filter_offtopic_activity = 1
num_per_page = 100
raw_cap_per_game = 5000
seed_cap_per_game = 200
random_seed = 0  # unused: the April seed used ORDER BY RANDOM()

