# Market analysis of historical and tactical strategy games.
#
# Cohorts: turn_structure (subgroups igo_ugo, alternating, wego), historical_peer,
# anchor. Tags: matched_basket marks the 2,000 to 14,000 review comparison basket,
# stand_in marks titles kept for coverage but excluded from matched-basket rows.

[study]
name = "strategy_market_2026"
title = "Market analysis of historical and tactical strategy games"
seed_db = "data/market_seed.db"
full_db = "data/market_full.db"
raw_dir = "data/raw/strategy_market_2026"
language_filter = true
aspect_lexicon = "studies/aspects_strategy_v1.toml"

[sampling]
method = "natural"            # census pull, uniform per-game seed sample
filter = "recent"             # creation-date order; "all" is helpfulness-sorted and biased
language = "english"
review_type = "all"           # never positive/negative: that would stratify
purchase_type = "all"
filter_offtopic_activity = 1
num_per_page = 100
raw_cap_per_game = 20000      # recent-first; effective window recorded when it binds
seed_cap_per_game = 500       # tuned to the committed size budget
random_seed = 42

[topics]
umap_preset = "bertopic_default"   # the legacy April UMAP collapses reviews into one cluster
min_topic_size = 40

[baseline]                    # population check (num_per_page=0)
language = "all"
purchase_type = "all"

